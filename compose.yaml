services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torob
      POSTGRES_USER: torob
      POSTGRES_PASSWORD: torob_dev
    ports:
      - "5432:5432"
    volumes:
      - torob-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torob -d torob"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  torob-postgres-data:
