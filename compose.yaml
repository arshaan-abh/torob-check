services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torob
      POSTGRES_USER: torob
      POSTGRES_PASSWORD: torob_dev
    ports:
      - "5432:5432"
    volumes:
      - torob-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torob -d torob"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://torob:torob_dev@postgres:5432/torob
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  torob-postgres-data:
